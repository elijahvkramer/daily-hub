name: Daily Hub Brief
on:
  # PRIMARY TRIGGER -- piggyback on Calendar Refresh.
  #
  # Why: GitHub's scheduler is dropping this workflow specifically. Measured 2026-09-02:
  # daily-brief asked for 36 scheduled fires between 11:00-13:57 UTC and got ZERO, while
  # calendar-refresh fired at 11:43 UTC inside that same window and succeeded. So the
  # scheduler was alive for this repo and simply refused this workflow. Asking MORE often
  # made it worse, not better (1 fire/day was honored ~60% of days; 36/day -> 0%).
  #
  # Calendar Refresh, by contrast, is honored 3-6 times every single day. Every one of its
  # completions now gives the brief another chance, and the guard below decides whether
  # this particular tick should actually publish. Replayed against the last 7 days of real
  # calendar-refresh fire times, this publishes 7/7 days -- five of them before 7:15am CT,
  # worst case 9:51am.
  workflow_run:
    workflows: ["Calendar Refresh", "Morning Tick"]
    types: [completed]

  # SECONDARY -- two low-frequency scheduled fires, at roughly the cadence GitHub was
  # still honoring before. If one lands it publishes earlier than the calendar tick would.
  # These are UTC and drift an hour with DST, which is harmless: the guard refuses to
  # publish outside 6am-5pm Central regardless of what the clock in the cron says.
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"

  # `auto: true` is how Hub Heartbeat (hub-heartbeat.yml) asks for the brief: it still goes through
  # the publish guard below, so it can never publish twice. A plain manual run (auto unset) skips
  # the guard and always redoes the day, as before.
  workflow_dispatch:
    inputs:
      auto:
        description: "Set by Hub Heartbeat; leave false to force a redo"
        required: false
        default: "false"
      news_date:
        description: "Redo ONLY the news edition for this past date (YYYY-MM-DD). Blank = today's full brief."
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    concurrency:
      group: daily-hub-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Several ticks a day reach this job; at most one may do real work.
      #  - Reads the LIVE tip of main, not the checked-out SHA: a tick that queued behind
      #    the concurrency group can carry a SHA from before this morning's publish commit.
      #  - Date is checked in UTC because that is what the brief publishes under
      #    (see claude-daily-brief-prompt.md Step 0), while the time-of-day window is
      #    checked in real Central time via tzdata, so it is DST-correct without arithmetic.
      #    Inside 4am-5pm Central the UTC and Central dates always agree, so the two can't
      #    disagree about which day "today" is.
      #  - Skipped entirely on workflow_dispatch, so a manual run can always force a redo.
      #  - Floor is 4am, not 6am: on 2026-09-03 a calendar tick landed at 4:46am CT and
      #    the old 6am floor rejected it, so the brief did not publish until the next
      #    tick at 9:32am. Publishing early is harmless -- the market section covers the
      #    PRIOR trading day's close, which is final long before 4am.
      - name: Decide whether this tick should publish
        id: guard
        if: github.event_name != 'workflow_dispatch' || inputs.auto == 'true'
        env:
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}
        run: |
          HOUR=$(TZ="America/Chicago" date +%-H)
          TODAY=$(date -u +%F)
          git fetch -q --depth=1 origin main
          git show origin/main:data/manifest.json > /tmp/manifest.json
          # Oct 15, 2026: "published" now means the BRIEF (the model) wrote today's edition. From
          # Oct 13-15 the model step was refused every morning (see allowed_bots below), the news
          # floor built an all-wire-feed edition instead, and this guard then called the day done --
          # so the model never got another try. An edition the floor built alone (auto_edition)
          # no longer counts; the model gets up to 3 attempts a day (data/brief-attempts.json).
          pip install --quiet cryptography >/dev/null 2>&1 || true
          git show origin/main:data/brief-attempts.json > /tmp/attempts.json 2>/dev/null || echo '{}' > /tmp/attempts.json
          printf '%s' "$CAL_PASSPHRASE" > /tmp/gp.txt
          STATE=$(TODAY="$TODAY" python3 scripts/brief_state.py /tmp/manifest.json /tmp/attempts.json /tmp/gp.txt)
          rm -f /tmp/gp.txt
          KIND=${STATE% *}; TRIES=${STATE#* }
          if [ "$HOUR" -lt 4 ] || [ "$HOUR" -gt 17 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "It is ${HOUR}:xx Central -- outside the 4am-5pm publish window. Skipping."
          elif [ "$KIND" = "model" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY is already published by the brief. Skipping."
          elif [ "${TRIES:-0}" -ge 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$TODAY: the brief already failed $TRIES times today -- leaving the wire-feed edition up."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$TODAY edition is '$KIND' (brief attempts so far: ${TRIES:-0}) -- running the brief now."
          fi

      - name: Install Python deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install --quiet cryptography

      - uses: anthropics/claude-code-action@v1
        id: brief
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Follow the instructions in .github/claude-daily-brief-prompt.md exactly, end to end."
          # Oct 15, 2026: Hub Heartbeat dispatches this workflow (and Calendar Refresh, whose
          # completion triggers it), so the run's actor is this repo's own github-actions[bot].
          # The action refuses bot-initiated runs unless the bot is listed -- "Workflow initiated
          # by non-human actor" -- and with continue-on-error that refusal was silent: no brief
          # Oct 13-15, only wire fillers. Only this repository's own Actions bot is allowed.
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch"
            --max-turns 150
        env:
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}
          NEWS_ONLY_DATE: ${{ inputs.news_date }}

      # THE NEWS FLOOR (Oct 12, 2026). The model published a two-story edition ("a quiet weekend")
      # and this job went green, because nothing after the model ever counted the stories. This
      # step is deterministic Python: it drops stale stories, tops every section up to at least
      # four from fresh publisher feeds (widening the window if needed), gives fillers their own
      # article text, and repairs "quiet day" framing. If the model published nothing at all it
      # builds the edition from the feeds, so News can never be empty. Runs even if the model
      # step crashed.
      - name: Enforce the news floor
        if: steps.guard.outputs.skip != 'true'
        env:
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}
        run: |
          printf '%s' "$CAL_PASSPHRASE" > "$RUNNER_TEMP/p.txt"
          git config user.email "elijahvkramer@gmail.com"
          git config user.name "Daily Hub Bot"
          TODAY="${{ inputs.news_date }}"; [ -n "$TODAY" ] || TODAY=$(date -u +%F)
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/enforce_news.py "$RUNNER_TEMP/p.txt" . --date="$TODAY"
            if [ -z "${{ inputs.news_date }}" ]; then
              TODAY="$TODAY" python3 scripts/brief_state.py --record "$RUNNER_TEMP/p.txt" "${{ steps.brief.outcome }}"
            fi
            git add -A data
            if git diff --cached --quiet; then echo "edition already meets the floor"; break; fi
            git commit -qm "news floor: $TODAY"
            if git push -q origin HEAD:main; then echo "pushed"; break; fi
            sleep $((attempt * 5))
          done
          rm -f "$RUNNER_TEMP/p.txt"

      # The action fails the job whenever Claude exceeds --max-turns, even when the brief
      # published perfectly. That is exactly what happened 2026-09-04: the brief published
      # at 6:57am and the run still went red, at 105 turns against a cap of 100. Run status
      # should reflect the deliverable, not how chatty the agent was -- so the step above is
      # allowed to fail and this step is the real verdict. A red X here now means one thing:
      # today genuinely did not publish.
      - name: Verify today actually published
        if: steps.guard.outputs.skip != 'true'
        env:
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}
        run: |
          TODAY="${{ inputs.news_date }}"; [ -n "$TODAY" ] || TODAY=$(date -u +%F)
          git fetch -q --depth=1 origin main
          git show origin/main:data/manifest.json > /tmp/verify.json
          if ! TODAY="$TODAY" python3 -c "import json,os,sys; sys.exit(0 if os.environ['TODAY'] in json.load(open('/tmp/verify.json')).get('news',[]) else 1)"; then
            echo "::error::$TODAY did NOT publish -- the brief is missing from the manifest."
            exit 1
          fi
          # Published is not enough: count the stories (Oct 12 shipped two and went green).
          printf '%s' "$CAL_PASSPHRASE" > "$RUNNER_TEMP/p.txt"
          git show "origin/main:data/news/$TODAY.json.enc" > "$RUNNER_TEMP/n.enc"
          python3 scripts/decrypt_calendar.py "$RUNNER_TEMP/n.enc" "$RUNNER_TEMP/p.txt" "$RUNNER_TEMP/n.json" >/dev/null
          rm -f "$RUNNER_TEMP/p.txt"
          python3 - "$RUNNER_TEMP/n.json" <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import news_guard
          ed = json.load(open(sys.argv[1]))
          counts = news_guard.section_counts(ed)
          print("section counts:", counts, "sports groups:", news_guard.sports_counts(ed))
          if ed.get("auto_edition"):
              print("::warning::the brief did not write this edition -- it is wire-feed fillers only. The next tick retries the brief.")
          thin = [t for t, n in counts.items() if n < news_guard.MIN_ITEMS]
          if thin:
              print("::error::news floor not met (fewer than %d stories) in: %s" % (news_guard.MIN_ITEMS, ", ".join(thin)))
              sys.exit(1)
          print("every section meets the floor")
          PY
          rm -f "$RUNNER_TEMP/n.json" "$RUNNER_TEMP/n.enc"
