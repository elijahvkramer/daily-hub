name: Daily Hub Brief
on:
  # PRIMARY TRIGGER -- piggyback on Calendar Refresh.
  #
  # Why: GitHub's scheduler is dropping this workflow specifically. Measured 2026-09-02:
  # daily-brief asked for 36 scheduled fires between 11:00-13:57 UTC and got ZERO, while
  # calendar-refresh fired at 11:43 UTC inside that same window and succeeded. So the
  # scheduler was alive for this repo and simply refused this workflow. Asking MORE often
  # made it worse, not better (1 fire/day was honored ~60% of days; 36/day -> 0%).
  #
  # Calendar Refresh, by contrast, is honored 3-6 times every single day. Every one of its
  # completions now gives the brief another chance, and the guard below decides whether
  # this particular tick should actually publish. Replayed against the last 7 days of real
  # calendar-refresh fire times, this publishes 7/7 days -- five of them before 7:15am CT,
  # worst case 9:51am.
  workflow_run:
    workflows: ["Calendar Refresh", "Morning Tick"]
    types: [completed]

  # SECONDARY -- two low-frequency scheduled fires, at roughly the cadence GitHub was
  # still honoring before. If one lands it publishes earlier than the calendar tick would.
  # These are UTC and drift an hour with DST, which is harmless: the guard refuses to
  # publish outside 6am-5pm Central regardless of what the clock in the cron says.
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"

  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    concurrency:
      group: daily-hub-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Several ticks a day reach this job; at most one may do real work.
      #  - Reads the LIVE tip of main, not the checked-out SHA: a tick that queued behind
      #    the concurrency group can carry a SHA from before this morning's publish commit.
      #  - Date is checked in UTC because that is what the brief publishes under
      #    (see claude-daily-brief-prompt.md Step 0), while the time-of-day window is
      #    checked in real Central time via tzdata, so it is DST-correct without arithmetic.
      #    Inside 4am-5pm Central the UTC and Central dates always agree, so the two can't
      #    disagree about which day "today" is.
      #  - Skipped entirely on workflow_dispatch, so a manual run can always force a redo.
      #  - Floor is 4am, not 6am: on 2026-09-03 a calendar tick landed at 4:46am CT and
      #    the old 6am floor rejected it, so the brief did not publish until the next
      #    tick at 9:32am. Publishing early is harmless -- the market section covers the
      #    PRIOR trading day's close, which is final long before 4am.
      - name: Decide whether this tick should publish
        id: guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          HOUR=$(TZ="America/Chicago" date +%-H)
          TODAY=$(date -u +%F)
          git fetch -q --depth=1 origin main
          git show origin/main:data/manifest.json > /tmp/manifest.json
          if [ "$HOUR" -lt 4 ] || [ "$HOUR" -gt 17 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "It is ${HOUR}:xx Central -- outside the 4am-5pm publish window. Skipping."
          elif TODAY="$TODAY" python3 -c "import json,os,sys; sys.exit(0 if os.environ['TODAY'] in json.load(open('/tmp/manifest.json')).get('news',[]) else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY is already published. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$TODAY not published yet and it is ${HOUR}:xx Central -- publishing now."
          fi

      - name: Install Python deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install --quiet cryptography

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Follow the instructions in .github/claude-daily-brief-prompt.md exactly, end to end."
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch"
            --max-turns 150
        env:
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}

      # The action fails the job whenever Claude exceeds --max-turns, even when the brief
      # published perfectly. That is exactly what happened 2026-09-04: the brief published
      # at 6:57am and the run still went red, at 105 turns against a cap of 100. Run status
      # should reflect the deliverable, not how chatty the agent was -- so the step above is
      # allowed to fail and this step is the real verdict. A red X here now means one thing:
      # today genuinely did not publish.
      - name: Verify today actually published
        if: steps.guard.outputs.skip != 'true'
        run: |
          TODAY=$(date -u +%F)
          git fetch -q --depth=1 origin main
          git show origin/main:data/manifest.json > /tmp/verify.json
          if TODAY="$TODAY" python3 -c "import json,os,sys; sys.exit(0 if os.environ['TODAY'] in json.load(open('/tmp/verify.json')).get('news',[]) else 1)"; then
            echo "$TODAY published successfully."
          else
            echo "::error::$TODAY did NOT publish -- the brief is missing from the manifest."
            exit 1
          fi
